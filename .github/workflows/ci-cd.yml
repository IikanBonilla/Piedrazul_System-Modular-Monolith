name: CI/CD

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: piedrazul_test
          POSTGRES_USER: piedrazul_user
          POSTGRES_PASSWORD: piedrazul_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U piedrazul_user -d piedrazul_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: piedrazul_test
      POSTGRES_USER: piedrazul_user
      POSTGRES_PASSWORD: piedrazul_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Pruebas del backend
        run: chmod +x mvnw && ./mvnw -B test
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pruebas y build del frontend
        working-directory: frontend
        run: npm ci && npx ng test --watch=false && npx ng build --configuration=development

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/sprint-1-cancelar-cita'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:sprint-1-cancelar-cita
