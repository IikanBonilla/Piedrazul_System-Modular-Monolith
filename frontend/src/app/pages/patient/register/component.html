<div class="mb-4">
  <h2 class="mb-1">Registro de paciente</h2>
  <p class="text-secondary mb-0">HE-02 / HU-2.2: cree su usuario para agendar citas</p>
</div>

<div class="card">
  <div class="card-body">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nombre de usuario</label>
        <input class="form-control" [(ngModel)]="username" name="username" autocomplete="username">
      </div>
      <div class="col-md-6">
        <label class="form-label">Contrasena</label>
        <input class="form-control" type="password" [(ngModel)]="password" name="password" autocomplete="new-password">
      </div>
      <div class="col-md-6">
        <label class="form-label">Nombre completo</label>
        <input class="form-control" [(ngModel)]="fullName" name="fullName">
      </div>
      <div class="col-md-6">
        <label class="form-label">Documento</label>
        <input class="form-control" [(ngModel)]="documentNumber" name="documentNumber">
      </div>
      <div class="col-md-6">
        <label class="form-label">Telefono</label>
        <input class="form-control" [(ngModel)]="phone" name="phone">
      </div>
      <div class="col-md-6 d-flex align-items-end">
        <button class="btn btn-primary w-100" (click)="register()" [disabled]="loading">
          Registrar
        </button>
      </div>
    </div>

    <div class="alert alert-warning mt-3 mb-0 py-2" *ngIf="formError">
      {{ formError }}
    </div>
    <div class="alert alert-success mt-3 mb-0 py-2" *ngIf="successMessage">
      {{ successMessage }}
      <a class="d-block mt-2 fw-semibold" routerLink="/paciente/agendar">Ir a agendar cita</a>
    </div>
  </div>
</div>
