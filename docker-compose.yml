services:
  postgres:
    image: postgres:16-alpine
    container_name: piedrazul-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: piedrazul_db
      POSTGRES_USER: piedrazul_user
      POSTGRES_PASSWORD: piedrazul_dev
    volumes:
      - piedrazul_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piedrazul_user -d piedrazul_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: piedrazul-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - piedrazul_keycloak:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

volumes:
  piedrazul_pgdata:
  piedrazul_keycloak:
