# =============================================================================
# PostgreSQL (esquema unico: public)
# Tablas JPA: doctors, app_users, appointments
# Override local: POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
# =============================================================================
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:piedrazul_db}
spring.datasource.username=${POSTGRES_USER:piedrazul_user}
spring.datasource.password=${POSTGRES_PASSWORD:piedrazul_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================================================
# JPA / Hibernate
# Sin Flyway/Liquibase: Hibernate crea/actualiza el esquema al arrancar
# =============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

# =============================================================================
# Aplicacion
# =============================================================================
spring.application.name=piedrazul-monolith
server.port=8080

# =============================================================================
# Swagger
# =============================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# =============================================================================
# Keycloak (IdP) y validacion JWT
# El backend no emite tokens: solo acepta access tokens del realm piedrazul.
# Keycloak debe estar arriba antes de arrancar la API (docker compose up -d).
# =============================================================================
piedrazul.keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8081}
piedrazul.keycloak.realm=${KEYCLOAK_REALM:piedrazul}
piedrazul.keycloak.admin-username=${KEYCLOAK_ADMIN:admin}
piedrazul.keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD:admin}
piedrazul.keycloak.public-client-id=${KEYCLOAK_PUBLIC_CLIENT:piedrazul-web}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:8081/realms/piedrazul}
